<div id="app">
  <div id="fx" aria-hidden="true"></div>

  <header id="bar">
    <button id="carChip" class="car-chip"><span id="carSil"></span><span class="cc-txt"><b id="carName"></b><small id="carSub"></small></span></button>
    <div id="occChip" class="occ-chip hidden"></div>
    <span class="bar-fill"></span>
    <button id="netChip" class="net-chip hidden"><svg class="ic"><use href="#i-nonet"/></svg><span>بدون نت</span></button>
    <div id="weather" class="weather"></div>
    <div class="st-icons">
      <svg class="ic st" id="stNet"><use href="#i-globe"/></svg>
      <button class="st-b" data-panel="wifi" aria-label="الواي فاي"><svg class="ic st" id="stWifi"><use href="#i-wifi"/></svg></button>
      <button class="st-b" data-panel="bt" aria-label="البلوتوث"><svg class="ic st" id="stBt"><use href="#i-bt"/></svg></button>
      <button class="st-b" data-panel="tires" aria-label="ضغط الإطارات"><svg class="ic st" id="stTire"><use href="#i-tire"/></svg><span id="tireLbl" class="num"></span></button>
      <button class="st-b" data-panel="fan" aria-label="حرارة الشاشة"><svg class="ic st" id="stFan"><use href="#i-thermo"/></svg><span id="fanLbl" class="num"></span></button>
    </div>
  </header>

  <main id="home">
    <section id="wClock" class="w w-clock">
      <div id="hGreet" class="greet"></div>
      <div id="clock" class="clock num">--:--</div>
      <div class="dates"><span id="dateHijri">&nbsp;</span><span id="dateGreg">&nbsp;</span></div>
    </section>

    <section id="wViz" class="w w-viz" aria-hidden="true"></section>

    <section id="prayerCard" class="w w-prayer">
      <button class="pc-city" id="pcCityB"><svg class="ic"><use href="#i-mosque"/></svg><span id="pcCity">مواقيت الصلاة</span></button>
      <div class="pc-next">
        <span class="pc-lbl" id="pcLbl">الصلاة القادمة</span>
        <b id="pcName">&nbsp;</b>
        <span id="pcTime" class="num"></span>
        <span id="pcCountdown" class="num"></span>
      </div>
      <div class="pc-bar" id="pcBar"></div>
      <ul id="prayerList" class="prayer-list"></ul>
    </section>
