<div id="app">
  <header id="topbar">
    <div class="tb-clock">
      <div id="clock" class="clock num">--:--</div>
      <div class="dates"><div id="dateHijri">&nbsp;</div><div id="dateGreg">&nbsp;</div></div>
      <button id="carChip" class="car-chip"><span id="carSil"></span><span class="cc-txt"><b id="carName"></b><small id="carSub"></small></span></button>
    </div>
    <div class="tb-mid">
      <div id="nextPill" class="next-pill"><span class="np-name">الصلاة القادمة</span><b class="np-time num">--:--</b><span class="np-left num"></span></div>
      <div id="occChip" class="occ-chip hidden"></div>
    </div>
    <div class="tb-status">
      <div id="weather" class="weather"></div>
      <div class="st-icons">
        <svg class="ic st" id="stGps"><use href="#i-gps"/></svg>
        <svg class="ic st" id="stNet"><use href="#i-globe"/></svg>
        <svg class="ic st" id="stWifi"><use href="#i-wifi"/></svg>
        <svg class="ic st" id="stBt"><use href="#i-bt"/></svg>
        <svg class="ic st" id="stFan"><use href="#i-thermo"/></svg>
      </div>
    </div>
  </header>

  <main id="main">
    <aside id="side">
      <section class="card gauge-card">
        <div id="gauge" class="gauge"></div>
        <div class="trip">
          <div><small>المسافة</small><b id="tripDist" class="num">0.0</b><i>كم</i></div>
          <div><small>المتوسط</small><b id="tripAvg" class="num">0</b><i>كم/س</i></div>
          <div><small>الأقصى</small><b id="tripMax" class="num">0</b><i>كم/س</i></div>
          <div><small>المدة</small><b id="tripTime" class="num">0:00</b><i>&nbsp;</i></div>
        </div>
      </section>
      <section class="card prayer-card" id="prayerCard">
        <div class="pc-head">
          <span class="pc-city"><svg class="ic"><use href="#i-mosque"/></svg><span id="pcCity">مواقيت الصلاة</span></span>
          <span id="pcCountdown" class="pc-count num"></span>
        </div>
        <ul id="prayerList" class="prayer-list"></ul>
      </section>
    </aside>

    <section id="mapWrap">
      <canvas id="map"></canvas>
      <button id="searchBar" class="search-bar"><svg class="ic"><use href="#i-search"/></svg><span>إلى أين؟</span></button>
      <div id="navCard" class="nav-card hidden">
        <div class="nc-icon" id="ncIcon"></div>
        <div class="nc-text"><b id="ncDist" class="num"></b><span id="ncInstr"></span></div>
      </div>
      <div id="mapCtl" class="map-ctl">
        <button id="btnZoomIn" class="round"><svg class="ic"><use href="#i-plus"/></svg></button>
        <button id="btnZoomOut" class="round"><svg class="ic"><use href="#i-minus"/></svg></button>
        <button id="btnCompass" class="round"><svg class="ic" id="compassIc"><use href="#i-compass"/></svg></button>
        <button id="btnLayers" class="round"><svg class="ic"><use href="#i-layers"/></svg></button>
      </div>
      <button id="btnLocate" class="round locate hidden"><svg class="ic"><use href="#i-locate"/></svg><span>توسيط</span></button>
      <div id="navBottom" class="nav-bottom hidden">
        <div><small>الوصول</small><b id="nbEta" class="num">--:--</b></div>
        <div><small>المتبقي</small><b id="nbLeft" class="num">--</b></div>
        <div><small>الوقت</small><b id="nbTime" class="num">--</b></div>
        <button id="nbVoice" class="chip"></button>
        <button id="nbStop" class="chip danger"><svg class="ic"><use href="#i-stop"/></svg>إنهاء</button>
      </div>
      <div id="speedWarn" class="speed-warn hidden"></div>
      <div id="attrib" class="attrib"></div>
      <div id="ctxMenu" class="ctx-menu hidden"></div>

      <div id="sheet" class="sheet hidden">
        <div class="sheet-head">
          <button id="sheetBack" class="round small hidden"><svg class="ic"><use href="#i-back"/></svg></button>
          <h2 id="sheetTitle"></h2>
          <button id="sheetClose" class="round small"><svg class="ic"><use href="#i-close"/></svg></button>
        </div>
        <div id="sheetBody" class="sheet-body"></div>
      </div>
    </section>
  </main>

  <nav id="dock">
    <button class="dk" data-panel="nav"><svg class="ic"><use href="#i-map"/></svg><span>الخرائط</span></button>
    <button class="dk" data-panel="radio"><svg class="ic"><use href="#i-radio"/></svg><span>المذياع</span></button>
    <button class="dk" data-panel="tasks"><svg class="ic"><use href="#i-tasks"/></svg><span>المهام</span><b class="badge hidden" id="taskBadge"></b></button>
    <button class="dk" data-panel="adhkar"><svg class="ic"><use href="#i-book"/></svg><span>الأذكار</span></button>
    <button class="dk" data-panel="bt"><svg class="ic"><use href="#i-bt"/></svg><span>البلوتوث</span></button>
    <button class="dk" data-panel="wifi"><svg class="ic"><use href="#i-wifi"/></svg><span>الواي فاي</span></button>
    <button class="dk" data-panel="fan"><svg class="ic" id="fanIc"><use href="#i-fan"/></svg><span id="fanLbl">المروحة</span></button>
    <div id="favs" class="favs"></div>
    <button class="dk" data-panel="apps"><svg class="ic"><use href="#i-apps"/></svg><span>التطبيقات</span></button>
    <button class="dk" data-panel="settings"><svg class="ic"><use href="#i-settings"/></svg><span>الإعدادات</span></button>
  </nav>

  <div id="miniPlayer" class="mini-player hidden">
    <button id="mpToggle" class="round small"><svg class="ic"><use href="#i-pause"/></svg></button>
    <span id="mpName"></span>
  </div>
  <div id="prayerAlert" class="prayer-alert hidden"></div>
  <div id="reminder" class="reminder hidden"></div>
  <div id="briefing" class="briefing hidden"></div>
  <div id="toast" class="toast"></div>
  <audio id="radioAudio" preload="none"></audio>
</div>

<script src="js/core.js"></script>
<script src="js/theme.js"></script>

<script src="js/radio.js"></script>
<script src="js/system.js"></script>
<script src="js/adhkar.js"></script>
<script src="js/tasks.js"></script>
<script src="js/fan.js"></script>
<script src="js/main.js"></script>
</body>
</html>
